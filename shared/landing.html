<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__NAME__</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#555;--acc:#1a3c5e;--rule:#d5dde5;--card:#f6f8fa}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--fg:#e8ecef;--mut:#9aa6b2;--acc:#7fb2e5;--rule:#2b333b;--card:#1c2229}}
*{box-sizing:border-box}
body{font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px;max-width:1100px;margin-inline:auto}
h1{font-size:1.4rem;color:var(--acc);margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 16px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
a.topic{color:inherit;text-decoration:none;border:1px solid var(--rule);border-left:6px solid var(--acc);border-radius:8px;padding:10px 12px;background:var(--card);display:block}
a.topic:hover{box-shadow:0 0 0 2px var(--acc)}
a.topic:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
a.topic b{display:block}
a.topic span{color:var(--mut);font-size:.92rem}
/*__BANNER_CSS__*/
</style></head><body>
<!--__BANNER__-->
<h1>__NAME__</h1>
<p class="sub">__TAGLINE__</p>
<main class="topics"><!--__TOPICS__--></main>
</body></html>
