<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__NAME__</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#555;--acc:#1a3c5e;--rule:#d5dde5;--card:#f6f8fa}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--fg:#e8ecef;--mut:#9aa6b2;--acc:#7fb2e5;--rule:#2b333b;--card:#1c2229}}
*{box-sizing:border-box}
body{font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px;max-width:1100px;margin-inline:auto}
h1{font-size:clamp(1.75rem,4vw,2.25rem);line-height:1.15;letter-spacing:-.01em;text-wrap:balance;color:var(--acc);margin:18px 0 4px}
.sub{color:var(--mut);margin:0 0 18px;max-width:65ch;text-wrap:pretty}
input[type=search]{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--fg)}
input[type=search]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hint{color:var(--mut);font-size:.85rem;margin:6px 0 0}
h2{font-size:.85rem;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start;margin-top:22px}
.fdesc{color:var(--mut);font-size:.9rem;margin:0 0 10px}
.topics{display:grid;gap:8px}
a.topic,a.hit{color:inherit;text-decoration:none;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--card);display:block}
a.topic:hover,a.hit:hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
a.topic{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:baseline}
a.topic b{grid-row:1;overflow-wrap:anywhere}
a.topic small{grid-row:1;grid-column:2;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
a.topic span{grid-row:2;grid-column:1/-1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
a.topic:focus-visible,a.hit:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
a.topic b,a.hit b{display:block;font-weight:600}
a.topic span,a.hit span{color:var(--mut);font-size:.92rem}
a.hit span{display:block}
a.topic small,a.hit small{font-size:.8rem}
a.hit small{color:var(--acc)}
#res{margin-top:16px;display:grid;gap:8px}
[hidden]{display:none!important}
#res .count{color:var(--mut);font-size:.9rem}
#res .hint a{color:var(--acc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/*__BANNER_CSS__*/
</style></head><body>
<!--__BANNER__-->
<main>
<h1>__NAME__</h1>
<p class="sub">__TAGLINE__</p>
<input type="search" id="q" placeholder="Search all entries by name or keyword" aria-label="Search all entries" autocomplete="off">
<p class="hint">Press / to search, Esc to clear, ↓ to move into the results, Enter to open the first one.</p>
<p id="st" class="sr" role="status"></p>
<div id="res" role="region" aria-label="Search results" hidden></div>
<div class="cols" id="fams"><!--__TOPICS__--></div>
</main>
<!--__FOOTER__-->
<script id="idx" type="application/json">/*__INDEX__*/</script>
<script>
/*__LANDING_JS__*/
</script>
</body></html>
