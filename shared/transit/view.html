<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ - __NAME__</title>
<style>
/*__TRANSIT_VARS__*/
body{--fam:var(--fc);--famf:var(--fcf)}
main{max-width:1120px;margin:0 auto;padding:0 clamp(1rem,3vw,2rem) 2rem}
h1{font:900 clamp(2.6rem,9vw,4.6rem)/.98 var(--g);letter-spacing:-.04em;margin:1rem 0 .6rem}
.sub{font-size:1.2rem;color:var(--mut);max-width:60ch;margin:0 0 1.6rem}
.loop{width:100%;height:auto;margin:1rem 0 2rem}
.loop .bg{fill:none;stroke-width:14;stroke-linecap:butt}
.loop .st{fill:var(--ground);stroke-width:7}.loop a:hover .st,.loop a:focus-visible .st{fill:var(--sc)}
.loop text{font:900 17px var(--g);fill:var(--ink);paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round}
.loop .lobe{font:900 20px var(--g);fill:var(--mut);stroke:none;text-anchor:middle}
.loop a:focus-visible{outline:none}.loop a:focus-visible .st{stroke:var(--ink)}
.grp2{margin-top:2.4rem}
.lname{display:inline-block;margin:0;padding:.2rem 1.1rem;border-radius:999px;background:var(--ink);color:var(--ground);font:900 1.2rem var(--g);letter-spacing:.02em}
.stops{position:relative;padding-left:64px;margin-top:1.4rem}
.stage{position:relative;padding-bottom:3rem}
.stage::before{content:"";position:absolute;left:-57px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--ground);border:6px solid var(--c)}
.stage::after{content:"";position:absolute;left:-45px;top:19px;bottom:-19px;width:12px;background:var(--c)}
.stage:last-child::after{display:none}
.stage h3{font:900 1.7rem/1.1 var(--g);letter-spacing:-.03em;margin:0 0 .2rem}
.stage h3 small{font:900 .95rem var(--g);background:var(--c);color:var(--cf);border-radius:999px;padding:.05rem .6rem;margin-right:.6rem;vertical-align:.2rem}
.stage>p{margin:.1rem 0 .6rem;color:var(--mut)}
.pills{display:flex;flex-wrap:wrap;gap:.5rem;margin:0;padding:0;list-style:none}
.pills a{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:.1rem .9rem;font-weight:900}
.pills a:hover{background:var(--ink);color:var(--ground)}.pills .none{color:var(--mut);padding:0;font-weight:500}
.unplaced a{margin-right:1rem;text-decoration:underline}
.note{color:var(--mut);font-size:.95rem;margin-top:2rem}
code{font:.88em ui-monospace,Menlo,monospace;background:var(--soft);padding:.05em .3em;border-radius:4px}
@media(max-width:560px){.loop{display:none}}
/*__BANNER_CSS__*/
</style></head><body data-fam="views">
<!--__BANNER__-->
<main>
<!--__CONTENT__-->
</main>
<!--__FOOTER__-->
</body></html>
