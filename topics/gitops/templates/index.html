<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitOps - Atlas</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#555;--acc:#1a3c5e;--rule:#d5dde5;--card:#f6f8fa;--ok:#2e7d32;--warn:#b58900;--bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--fg:#e8ecef;--mut:#9aa6b2;--acc:#7fb2e5;--rule:#2b333b;--card:#1c2229;--ok:#4caf50;--warn:#d4a72c;--bad:#ef5350}}
*{box-sizing:border-box}
/*__BANNER_CSS__*/
body{font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px;max-width:1100px;margin-inline:auto}
h1{font-size:1.4rem;color:var(--acc);margin:0 0 2px}
h2{font-size:1.05rem;color:var(--acc);margin:20px 0 2px;border-bottom:1px solid var(--rule);padding-bottom:3px}
.sub{color:var(--mut);margin:0 0 12px;font-size:.95rem}
.note{border-left:4px solid var(--acc);background:var(--card);padding:8px 12px;border-radius:4px;font-size:.92rem;margin-bottom:12px}
.about{color:var(--mut);font-size:.9rem;margin:0 0 6px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--rule);z-index:2}
input[type=search]{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--fg)}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tab{font:inherit;color:var(--fg);background:transparent;border:0;border-bottom:3px solid transparent;padding:4px 10px;cursor:pointer}
.tab[aria-selected=true]{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--rule)}
th{color:var(--mut);font-weight:600;font-size:.82rem}
td small{display:block;color:var(--mut)}
button.nm{font:inherit;font-weight:600;color:var(--acc);background:none;border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline}
.badge{font-size:.74rem;border:1px solid var(--rule);background:var(--bg);color:var(--mut);border-radius:999px;padding:0 8px;white-space:nowrap;display:inline-block}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.bad{color:var(--bad);border-color:var(--bad)}
.q{color:var(--warn);font-weight:700;cursor:help}
.empty{color:var(--mut);padding:16px 0}
.pg{padding:4px 0 0}

.cmp th:first-child,.cmp td:first-child{white-space:nowrap}
dialog{width:min(820px,calc(100vw - 24px));max-height:calc(100vh - 24px);border:1px solid var(--rule);border-radius:12px;background:var(--bg);color:var(--fg);padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:1}
.dh b{flex:1}
.dh button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:4px 12px;cursor:pointer}
.db{padding:12px 14px 18px}
.db h3{margin:0;font-size:1.25rem}
.db .meta{color:var(--mut);font-size:.9rem;margin:2px 0 8px}
.db h4{margin:16px 0 6px;font-size:.95rem;color:var(--acc)}
.db ul{margin:4px 0;padding-left:20px}
.db li{margin:2px 0}
.db ul.lk{display:flex;flex-wrap:wrap;gap:4px 18px;list-style:none;padding:0}
.db a{color:var(--acc)}
.ver{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.92rem}
.ver div{margin:2px 0}
.ver span{color:var(--mut)}
.nt{border-left:4px solid var(--warn);background:var(--card);padding:6px 12px;border-radius:4px;font-size:.9rem}
.nt ul{margin:2px 0}
/* learning layout: an entry whose sections have a part (overview, use, run, reference) */
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.db code,.db pre{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.db code{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{font-size:.8rem;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:1px 10px;white-space:nowrap}
.chip b{font-weight:600}
.chip.ok{color:var(--ok);border-color:var(--ok)}
details.ae{font-size:.88rem;color:var(--mut);margin:4px 0 8px}
details.ae summary{cursor:pointer}
details.ae .ver{color:var(--fg)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pills a{display:inline-flex;gap:5px;align-items:center;text-decoration:none;border:1px solid var(--rule);border-radius:8px;padding:3px 10px;font-size:.88rem}
.pills a:hover{border-color:var(--acc)}
.pills .ic{width:14px;height:14px}
.jump{position:sticky;top:var(--barh,0);z-index:1;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:6px 0;border-bottom:1px solid var(--rule);margin:8px 0 4px}
dialog .jump{position:static}
.jump a{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none;padding:4px 10px;border-radius:999px;font-size:.9rem}
.jump a:hover,.jump a.on{background:var(--card)}
.part{margin-top:22px;scroll-margin-top:calc(var(--barh,0px) + 56px)}
.ph{display:flex;align-items:center;gap:10px;font-size:1.15rem;color:var(--acc);margin:0 0 4px;padding:6px 0;border-bottom:2px solid var(--acc)}
.ph .ic{width:24px;height:24px}
.ph small{font-weight:400;color:var(--mut);font-size:.88rem;margin-left:auto}
.sec{margin:14px 0 4px;scroll-margin-top:calc(var(--barh,0px) + 56px)}
.sec>h4,details.sec>summary{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:1rem;color:var(--fg)}
.sec>h4 .ic{color:var(--acc)}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--bg);font-size:.8rem;font-weight:700;flex:none}
.lead{margin:0 0 6px;color:var(--mut)}
details.sec{border:1px solid var(--rule);border-radius:8px;padding:8px 12px;margin:8px 0}
details.sec>summary{cursor:pointer;margin:0}
details.sec[open]>summary{margin-bottom:8px}
figure.code{margin:8px 0;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--card);border-bottom:1px solid var(--rule);font-size:.85rem}
.ch b{flex:1;font-weight:600}
.ch .lang{color:var(--mut);font-size:.78rem;text-transform:uppercase}
.cp{font:inherit;font-size:.8rem;display:inline-flex;gap:4px;align-items:center;color:var(--fg);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:2px 8px;cursor:pointer}
.cp .ic{width:14px;height:14px}
figure.code pre{margin:0;padding:10px 12px;overflow-x:auto;background:var(--bg)}
figure.code pre code{background:none;border:0;padding:0}
figure.code figcaption{font-size:.8rem;color:var(--mut);padding:4px 10px;border-top:1px solid var(--rule)}
.co{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-left-width:4px;border-radius:6px;padding:8px 12px;margin:8px 0;background:var(--card);font-size:.93rem}
.co .ic{margin-top:2px}
.co b{margin-right:4px}
.co.gotcha{border-left-color:var(--warn)}.co.gotcha .ic{color:var(--warn)}
.co.default{border-left-color:var(--acc)}.co.default .ic{color:var(--acc)}
.co.prod{border-left-color:var(--ok)}.co.prod .ic{color:var(--ok)}
.co.tip{border-left-color:var(--mut)}.co.tip .ic{color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0}
.card{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--card)}
.card .ic{width:26px;height:26px;color:var(--acc);display:block;margin-bottom:4px}
.card b{display:block;margin-bottom:2px}
.card p{margin:0;font-size:.9rem;color:var(--mut)}
ul.chk{list-style:none;padding-left:0}
ul.chk li{display:flex;gap:8px;align-items:flex-start}
ul.chk .ic{color:var(--ok);margin-top:2px}
.tb{margin:8px 0}
.tb caption{caption-side:bottom;text-align:left;color:var(--mut);font-size:.8rem;padding-top:4px}
.uc{display:inline-flex;gap:3px;align-items:center;font-size:.75rem;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:0 6px;margin-left:4px;white-space:nowrap}
.uc .ic{width:12px;height:12px}
.ucr{display:block;color:var(--mut);font-size:.82rem}
.dg{margin:10px 0}
.dg svg{display:block;width:100%;height:auto;max-width:var(--w);margin:0 auto;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
.dg figcaption{color:var(--mut);font-size:.85rem;text-align:center;margin-top:4px}
.dg text{fill:var(--fg);font:12px system-ui,sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.dg .sub{font-size:10.5px;fill:var(--mut)}
.dg .lt{font-size:10.5px;fill:var(--mut)}
.dg .bt{font-size:11px;font-weight:600;fill:var(--mut);text-anchor:start}
.dg rect.n{fill:var(--bg);stroke:var(--acc);stroke-width:1.4}
.dg rect.hub{fill:var(--acc);fill-opacity:.18;stroke-width:2}
.dg rect.ext{stroke-dasharray:5 3;stroke:var(--mut)}
.dg rect.bus{fill:var(--warn);fill-opacity:.2;stroke:var(--warn)}
.dg rect.store{stroke:var(--ok)}
.dg rect.box{fill:none;stroke:var(--rule);stroke-width:1.4;stroke-dasharray:2 4}
.dg line{stroke:var(--acc);stroke-width:1.5}
.dg line.dash{stroke-dasharray:6 4}
.dg marker path{fill:var(--acc)}
</style></head><body>

<svg style="display:none" aria-hidden="true"><symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></symbol><symbol id="i-server" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/><path d="M8 7.5h.01M8 16.5h.01"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9 16H3z"/><path d="M12 10v4M12 17h.01"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></symbol><symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17h.01"/></symbol><symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol><symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol><symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol><symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></symbol><symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-5 3 10 2-5h7"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></symbol><symbol id="i-git" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-11 7"/></symbol><symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 0 1 0 6M21 20c0-2.5-1.5-4-3.5-4.7"/></symbol><symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol><symbol id="i-wrench" viewBox="0 0 24 24"><path d="M15 4a5 5 0 0 0-5.5 6.5L4 16l4 4 5.5-5.5A5 5 0 0 0 20 9l-3 1-2-2 1-3z"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-login" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/></symbol><symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol><symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 4v16M5 8h14M5 8l-3 6a3 3 0 0 0 6 0zM19 8l-3 6a3 3 0 0 0 6 0z"/></symbol></svg>
<h1 id="title"></h1>
<p class="sub" id="intro"></p>
<div class="note" id="scope"></div>
<div class="bar">
  <div class="tabs" role="tablist" id="tabs"></div>
  <input type="search" id="q" placeholder="Search name or text" aria-label="Search">
</div>
<main id="out"></main>
<dialog id="dlg"><div class="dh"><b id="dt"></b><button id="close" type="button">Close</button></div><div class="db" id="db"></div></dialog>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const byId=Object.fromEntries(D.entries.map(e=>[e.id,e]));
const STATUS={active:'ok',inactive:'warn',archived:'bad'};
// One tab per product, in this order. Everything else is listed on the Other tools tab.
const TABS=[
  {id:'opengitops',label:'GitOps principles'},
  {id:'argo-cd',label:'Argo CD'},
  {id:'flux',label:'Flux'},
  {id:'helm',label:'Helm'},
  {id:'kustomize',label:'Kustomize'},
  {id:'others',label:'Other tools'},
  {id:'compare',label:'Compare'}
];
const OWN=new Set(TABS.map(t=>t.id));
let view=TABS[0].id;
$('title').textContent=D.title;
$('intro').textContent=D.intro;
$('scope').textContent=D.scope+' Checked '+D.checked+'. Every entry shows the version it was analysed against.';

const text=e=>JSON.stringify(e).toLowerCase();
const started=e=>esc(e.started.date)+(e.started.confirmed?'':' <span class="q" title="Unconfirmed: '+esc(e.started.basis)+'">?</span>');
const cncf=e=>'<span class="badge'+(e.cncf.level==='graduated'?' ok':'')+'" title="'+esc(e.cncf.text)+'">'+(e.cncf.level==='none'?'not CNCF':'CNCF '+e.cncf.level)+'</span>';
const latest=e=>esc(e.version.analysed)+'<small>'+esc(e.version.released)+'</small>';
const nameBtn=e=>'<button class="nm" type="button" data-id="'+esc(e.id)+'">'+esc(e.name)+'</button>';

function entries(f){
  return D.groups.map(g=>{
    const rows=D.entries.filter(e=>e.group===g.id&&!OWN.has(e.id)&&(!f||text(e).includes(f)));
    if(!rows.length)return '';
    return '<h2>'+esc(g.label)+'</h2><p class="about">'+esc(g.about)+'</p><div class="wrap"><table><thead><tr><th>Name</th><th>Started</th><th>Status</th><th>CNCF</th><th>Version analysed</th><th>Licence</th></tr></thead><tbody>'
      +rows.map(e=>'<tr><td>'+nameBtn(e)+'<small>'+esc(e.summary)+'</small></td><td>'+started(e)+'</td><td><span class="badge '+STATUS[e.status]+'">'+esc(e.status)+'</span></td><td>'+cncf(e)+'</td><td>'+latest(e)+'</td><td>'+esc(e.license)+'</td></tr>').join('')
      +'</tbody></table></div>';
  }).join('')||'<p class="empty">Nothing matches.</p>';
}

function compare(f){
  return (D.comparisons||[]).filter(c=>!f||text(c).includes(f)).map(c=>{
    const head=(c.rows[0].entry?'<th>Tool</th>':'<th></th>')+c.columns.map(x=>'<th>'+esc(x)+'</th>').join('');
    const rows=c.rows.map(r=>'<tr><td>'+(r.entry?nameBtn(byId[r.entry]):'<b>'+esc(r.label)+'</b>')+'</td>'+r.cells.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('');
    return '<h2>'+esc(c.title)+'</h2><p class="about">'+esc(c.about)+'</p><div class="wrap"><table class="cmp"><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }).join('')||'<p class="empty">Nothing matches.</p>';
}

function render(){
  const f=$('q').value.trim().toLowerCase();
  const list=view==='others'||view==='compare';
  $('q').style.display=list?'':'none';
  if(window.setBar)setBar();  // the top bar is shorter without the search box
  $('out').innerHTML=view==='others'?entries(f):view==='compare'?compare(f):'<div class="pg db">'+detail(byId[view])+'</div>';
}

function tab(id,push){
  view=id;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===id));
  render();
  window.scrollTo(0,0);
  if(push!==false)history.replaceState(null,'',byId[id]?'#'+id:location.pathname);
}

function link(id){return byId[id]?'<a href="#'+esc(id)+'" data-id="'+esc(id)+'">'+esc(byId[id].name)+'</a>':''}

// Learning layout. Icons come from the sprite at the top of the page.
const ic=n=>'<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
// `code` and [label](url) in text. A url is https or a relative page of this site.
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(((?:https:\/\/|\.\.\/)[^)\s]+)\)/g,(m,l,u)=>'<a href="'+u+'"'+(u.startsWith('https')?' target="_blank" rel="noopener"':'')+'>'+l+'</a>');
const PARTS=[{id:'overview',label:'Overview',icon:'book',lead:'What it is and how it works'},{id:'use',label:'Use it',icon:'play',lead:'Typical use, step by step'},
  {id:'run',label:'Run it',icon:'server',lead:'Owning and operating it'},{id:'reference',label:'Reference',icon:'list',lead:'Lookup tables'}];
const CALLOUT={gotcha:['alert','Watch out'],default:['info','Default'],prod:['shield','In production'],tip:['bulb','Tip']};
const uc=r=>r?' <span class="uc" title="'+esc(r)+'">'+ic('help')+'unconfirmed</span><small class="ucr">'+esc(r)+'</small>':'';
function item(i,eid){
  if(typeof i==='string')return null;
  switch(i.type){
    case 'code':return '<figure class="code"><div class="ch">'+ic(i.lang==='shell'?'terminal':'file')+'<b>'+esc(i.title||'')+'</b><span class="lang">'+esc(i.lang||'')+'</span><button type="button" class="cp">'+ic('copy')+'Copy</button></div><pre><code>'+esc(i.body)+'</code></pre>'
      +(i.source?'<figcaption>Source: <a href="'+esc(i.source.url)+'" target="_blank" rel="noopener">'+esc(i.source.label)+'</a>'+(i.note?' &middot; '+md(i.note):'')+'</figcaption>':'')+'</figure>';
    case 'table':return '<div class="wrap tb"><table>'+(i.caption?'<caption>'+md(i.caption)+'</caption>':'')+'<thead><tr>'+i.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'
      +i.rows.map(r=>'<tr>'+r.map(c=>'<td>'+md(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    case 'callout':{const k=CALLOUT[i.kind]||CALLOUT.tip;return '<div class="co '+esc(i.kind)+'">'+ic(k[0])+'<div><b>'+esc(i.title||k[1])+'</b>'+md(i.text)+uc(i.unconfirmed)+'</div></div>';}
    case 'cards':return '<div class="cards">'+i.cards.map(c=>'<div class="card">'+ic(c.icon||'box')+'<b>'+esc(c.title)+'</b><p>'+md(c.text)+'</p></div>').join('')+'</div>';
    case 'checklist':return '<ul class="chk">'+i.items.map(x=>'<li>'+ic('check')+'<span>'+md(x)+'</span></li>').join('')+'</ul>';
    case 'diagram':return '<figure class="dg">'+svgDiagram(i)+(i.caption?'<figcaption>'+esc(i.caption)+'</figcaption>':'')+'</figure>';
    default:return null;  // {text, unconfirmed}: a bullet
  }
}
function items(list,eid){
  let h='',ul=[];
  const flush=()=>{if(ul.length)h+='<ul>'+ul.join('')+'</ul>';ul=[];};
  list.forEach(i=>{const r=item(i,eid);if(r===null){ul.push('<li>'+(typeof i==='string'?md(i):md(i.text)+uc(i.unconfirmed))+'</li>');}else{flush();h+=r;}});
  flush();return h;
}
// A diagram spec: w, h, boxes (frames), nodes (x, y is the centre), links (from, to, label, arrow none|to|both, dashed).
function svgDiagram(d){
  const N=Object.fromEntries(d.nodes.map(n=>[n.id,n]));
  const edge=(n,tx,ty)=>{const dx=tx-n.x,dy=ty-n.y;if(!dx&&!dy)return[n.x,n.y];
    const k=Math.min(dx?(n.w/2)/Math.abs(dx):Infinity,dy?(n.h/2)/Math.abs(dy):Infinity);return[n.x+dx*k,n.y+dy*k];};
  let s='<svg viewBox="0 0 '+d.w+' '+d.h+'" style="--w:'+d.w+'px" role="img" aria-label="'+esc(d.alt)+'"><title>'+esc(d.alt)+'</title>'
    +'<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>';
  (d.boxes||[]).forEach(b=>{s+='<rect class="box" x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" rx="10"/><text class="bt" x="'+(b.x+10)+'" y="'+(b.y+16)+'">'+esc(b.label)+'</text>';});
  (d.links||[]).forEach(l=>{const a=N[l.from],b=N[l.to];const p=edge(a,b.x,b.y),q=edge(b,a.x,a.y);const ar=l.arrow||'none';
    s+='<line class="'+(l.dashed?'dash':'')+'" x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'"'
      +(ar==='to'||ar==='both'?' marker-end="url(#ar)"':'')+(ar==='both'?' marker-start="url(#ar)"':'')+'/>';
    if(l.label)s+='<text class="lt" text-anchor="middle" x="'+((p[0]+q[0])/2+(l.dx||0)).toFixed(1)+'" y="'+(((p[1]+q[1])/2)-4+(l.dy||0)).toFixed(1)+'">'+esc(l.label)+'</text>';});
  d.nodes.forEach(n=>{s+='<rect class="n '+esc(n.kind||'')+'" x="'+(n.x-n.w/2)+'" y="'+(n.y-n.h/2)+'" width="'+n.w+'" height="'+n.h+'" rx="6"/>'
    +'<text text-anchor="middle" x="'+n.x+'" y="'+(n.sub?n.y-2:n.y+4)+'">'+esc(n.label)+'</text>'
    +(n.sub?'<text class="sub" text-anchor="middle" x="'+n.x+'" y="'+(n.y+12)+'">'+esc(n.sub)+'</text>':'');});
  return s+'</svg>';
}
function learning(e){
  const v=e.version,pid=p=>'p-'+e.id+'-'+p;
  let h='<h3>'+esc(e.name)+'</h3><p class="meta">'+esc(e.summary)+'</p>'
    +'<div class="chips"><span class="chip"><b>Version analysed</b> '+esc(v.name)+' '+esc(v.analysed)+'</span><span class="chip">released '+esc(v.released)+'</span><span class="chip">checked '+esc(v.checked)+'</span>'
    +'<span class="chip">started '+started(e)+'</span><span class="chip '+(e.status==='active'?'ok':'')+'">'+esc(e.status)+'</span><span class="chip">'+esc(e.license)+'</span>'+cncf(e).replace('class="badge','class="chip')+'</div>'
    +'<details class="ae"><summary>About this entry: sources and how it was checked</summary><div class="ver"><div><span>Source:</span> '+esc(v.docs||'')+'</div>'
    +'<div><span>Started:</span> '+started(e)+' <span>('+esc(e.started.basis)+')</span></div>'+(e.maintainer?'<div><span>Maintainer:</span> '+esc(e.maintainer)+'</div>':'')
    +'<div><span>CNCF:</span> '+esc(e.cncf.text)+'</div></div></details>';
  const parts=PARTS.filter(p=>e.sections.some(s=>s.part===p.id));
  h+='<nav class="jump" aria-label="On this page">'+parts.map(p=>'<a href="#'+pid(p.id)+'" data-jump="'+pid(p.id)+'">'+ic(p.icon)+esc(p.label)+'</a>').join('')
    +'<a href="#'+pid('more')+'" data-jump="'+pid('more')+'">'+ic('scale')+'Compared and sources</a></nav>';
  if(e.links&&e.links.length)h+='<div class="pills">'+e.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+ic('ext')+'</a>').join('')+'</div>';
  parts.forEach(p=>{
    h+='<section class="part" id="'+pid(p.id)+'"><h3 class="ph">'+ic(p.icon)+esc(p.label)+'<small>'+esc(p.lead)+'</small></h3>';
    e.sections.filter(s=>s.part===p.id).forEach(s=>{
      const title=(s.step?'<span class="step">'+s.step+'</span>':s.icon?ic(s.icon):'')+esc(s.title);
      const body=(s.intro?'<p class="lead">'+md(s.intro)+'</p>':'')+items(s.items,e.id);
      h+=p.id==='reference'?'<details class="sec"><summary>'+title+'</summary>'+body+'</details>':'<div class="sec"><h4>'+title+'</h4>'+body+'</div>';
    });
    h+='</section>';
  });
  h+='<section class="part" id="'+pid('more')+'"><h3 class="ph">'+ic('scale')+'Compared and sources<small>How it relates, what is not confirmed, where it comes from</small></h3>';
  if(e.compare&&e.compare.length)h+='<h4>Compared</h4><ul>'+e.compare.map(c=>'<li>'+link(c.with)+': '+md(c.text)+'</li>').join('')+'</ul>';
  if(e.related&&e.related.length)h+='<h4>Related</h4><p>'+e.related.map(link).join(', ')+'</p>';
  if(e.notes&&e.notes.length)h+='<h4>Unconfirmed and notes</h4><div class="nt"><ul>'+e.notes.map(n=>'<li>'+md(n)+'</li>').join('')+'</ul></div>';
  h+='<h4>Sources</h4><ul>'+e.sources.map(s=>'<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a> <span class="badge">'+(s.date?'page dated '+esc(s.date):'no date on page')+'</span></li>').join('')+'</ul></section>';
  return h;
}

function detail(e){
  if(e.sections.some(s=>s.part))return learning(e);
  const v=e.version;
  let h='<h3>'+esc(e.name)+'</h3><p class="meta">'+esc(e.summary)+'</p>'
    +'<div class="ver"><div><b>Version analysed:</b> '+esc(v.name)+' '+esc(v.analysed)+' <span>(released '+esc(v.released)+')</span></div>'
    +(v.docs?'<div><span>Source:</span> '+esc(v.docs)+'</div>':'')
    +'<div><span>Checked:</span> '+esc(v.checked)+'</div>'
    +'<div><span>Started:</span> '+started(e)+' <span>('+esc(e.started.basis)+')</span></div>'
    +'<div><span>Status:</span> '+esc(e.status)+' &middot; <span>Licence:</span> '+esc(e.license)+(e.maintainer?' &middot; <span>Maintainer:</span> '+esc(e.maintainer):'')+'</div>'
    +'<div><span>CNCF:</span> '+esc(e.cncf.text)+'</div></div>';
  if(e.links&&e.links.length)h+='<h4>Links</h4><ul class="lk">'+e.links.map(l=>'<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a></li>').join('')+'</ul>';
  h+=e.sections.map(s=>'<h4>'+esc(s.title)+'</h4><ul>'+s.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>').join('');
  if(e.compare&&e.compare.length)h+='<h4>Compared</h4><ul>'+e.compare.map(c=>'<li>'+link(c.with)+': '+esc(c.text)+'</li>').join('')+'</ul>';
  if(e.related&&e.related.length)h+='<h4>Related</h4><p>'+e.related.map(link).join(', ')+'</p>';
  if(e.notes&&e.notes.length)h+='<h4>Unconfirmed and notes</h4><div class="nt"><ul>'+e.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>';
  h+='<h4>Sources</h4><ul>'+e.sources.map(s=>'<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a> <span class="badge">'+(s.date?'page dated '+esc(s.date):'no date on page')+'</span></li>').join('')+'</ul>';
  return h;
}

function open(id,push){
  const e=byId[id];if(!e)return;
  if(OWN.has(id)){if($('dlg').open)$('dlg').close();tab(id,push);return;}
  $('dt').textContent=e.name;$('db').innerHTML=detail(e);
  if(!$('dlg').open)$('dlg').showModal();
  $('db').scrollTop=0;$('dlg').scrollTop=0;
  if(push!==false)history.replaceState(null,'','#'+id);
}

document.addEventListener('click',ev=>{
  const j=ev.target.closest('[data-jump]');
  if(j){ev.preventDefault();const el=document.getElementById(j.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth'});return;}
  const c=ev.target.closest('.cp');
  if(c){const code=c.closest('figure').querySelector('code').textContent;const done=()=>{c.lastChild.textContent='Copied';setTimeout(()=>c.lastChild.textContent='Copy',1500);};
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(c.closest('figure').querySelector('code'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);try{document.execCommand('copy');done();}catch(_){}}; 
    if(navigator.clipboard)navigator.clipboard.writeText(code).then(done,fallback);else fallback();return;}
  const t=ev.target.closest('[data-id]');
  if(t){ev.preventDefault();open(t.dataset.id);}
});
$('close').onclick=()=>$('dlg').close();
$('dlg').addEventListener('close',()=>{if(!OWN.has(view)||!byId[view])history.replaceState(null,'',location.pathname);else history.replaceState(null,'','#'+view);});
$('q').addEventListener('input',render);
$('tabs').innerHTML=TABS.map(t=>'<button class="tab" role="tab" data-v="'+t.id+'" aria-selected="false">'+esc(t.label)+'</button>').join('');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.v));
window.setBar=()=>document.documentElement.style.setProperty('--barh',document.querySelector('.bar').offsetHeight+'px');
setBar();addEventListener('resize',setBar);
tab(TABS[0].id,false);
if(location.hash)open(decodeURIComponent(location.hash.slice(1)),false);
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(byId[id]&&id!==view&&!($('dlg').open&&$('dt').textContent===byId[id].name))open(id,false);});
</script>
