<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitOps - Atlas</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#555;--acc:#1a3c5e;--rule:#d5dde5;--card:#f6f8fa}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--fg:#e8ecef;--mut:#9aa6b2;--acc:#7fb2e5;--rule:#2b333b;--card:#1c2229}}
*{box-sizing:border-box}

.atlas{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:0 0 8px;margin:0 0 12px}
.atlas a{color:var(--fg);text-decoration:none;padding:4px 12px;border-radius:8px;border:1px solid transparent}
.atlas a:hover{border-color:var(--rule)}
.atlas a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.atlas .home{font-weight:700;color:var(--acc);margin-right:6px}
.atlas a[aria-current=page]{background:var(--acc);color:var(--bg);font-weight:600}

body{font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px;max-width:1100px;margin-inline:auto}
h1{font-size:1.4rem;color:var(--acc);margin:0 0 2px}
h2{font-size:1.05rem;color:var(--acc);margin:20px 0 6px;border-bottom:1px solid var(--rule);padding-bottom:3px}
.sub{color:var(--mut);margin:0 0 12px}
.empty{color:var(--mut);padding:16px 0}
</style></head><body>
<nav class="atlas" aria-label="Topics"><a class="home" href="../index.html">Atlas</a><a href="../azure/index.html">Azure with Terraform</a><a href="../gitops/index.html" aria-current="page">GitOps</a></nav>
<h1 id="title"></h1>
<p class="sub" id="intro"></p>
<main id="out"></main>
<script id="data" type="application/json">{"title": "GitOps", "intro": "Argo CD and GitOps: concepts, patterns and how they fit together.", "sections": []}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('title').textContent=D.title;
document.getElementById('intro').textContent=D.intro;
document.getElementById('out').innerHTML=D.sections.map(s=>'<h2>'+esc(s.title)+'</h2>').join('')||'<p class="empty">Nothing collected yet.</p>';
</script>
</body></html>
