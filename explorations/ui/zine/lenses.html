<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lenses · Atlas zine</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Atkinson+Hyperlegible:wght@400;700&display=swap"><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}a{color:inherit}img,svg{max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

:root{--ink:#111;--paper:#F5F8FB;--yel:#FFE14D;--pink:#FF9EC7;--teal:#7FE0D2;--mut:#3C4650;--h:'Caveat Brush','Comic Sans MS',cursive;--b:'Atkinson Hyperlegible','Trebuchet MS',sans-serif}
body{background:var(--paper) linear-gradient(rgba(60,90,130,.07) 1px,transparent 1px) 0 0/100% 28px;color:var(--ink);font:400 1.125rem/1.6 var(--b)}
::selection{background:var(--pink);color:var(--ink)}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
a{text-decoration:none;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:1.5rem clamp(1rem,3vw,2rem) 4rem}
h1,h2,h3{font-family:var(--h);font-weight:400;margin:0;letter-spacing:.01em}
.hero{display:grid;grid-template-columns:auto 1fr;gap:1rem 2rem;align-items:center;margin-bottom:1.5rem}
.mascot{width:clamp(90px,16vw,150px);transform:rotate(-6deg)}
h1{font-size:clamp(3.4rem,12vw,6rem);line-height:.95}
.hl{background:linear-gradient(transparent 58%,var(--yel) 58% 92%,transparent 92%);padding:0 .1em}
.say{position:relative;display:inline-block;max-width:44ch;margin:.8rem 0 0;padding:.7rem 1.1rem;border:2.5px solid var(--ink);border-radius:255px 14px 225px 14px / 14px 225px 14px 255px;background:#fff;font-size:1.15rem}
.find{display:block;max-width:640px;margin-top:1rem;border:3px solid var(--ink);border-radius:14px 225px 14px 255px / 255px 14px 225px 14px;background:#fff;padding:.2rem 1.2rem}
#q{width:100%;border:0;background:transparent;font:400 1.5rem var(--h);color:var(--ink);padding:.6rem 0;letter-spacing:.02em}#q:focus-visible{outline:0}
.find:focus-within{outline:3px dashed var(--ink);outline-offset:4px}
.hint{font-size:.95rem;color:var(--mut);margin:.5rem 0 0}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6rem;margin-top:2rem}
.panel{background:#fff;border:3px solid var(--ink);border-radius:255px 14px 225px 14px / 14px 225px 14px 255px;padding:1.2rem 1.4rem 1.4rem;transform:rotate(var(--rot,0deg))}
.panel:nth-child(even){border-radius:14px 225px 14px 255px / 255px 14px 225px 14px;--rot:.5deg}.panel:nth-child(odd){--rot:-.4deg}
.panel h2{font-size:2.4rem;line-height:1}.panel h2 span{background:var(--c);padding:0 .35em;border-radius:6px 14px 8px 12px}
.panel p{margin:.4rem 0 1rem;color:var(--mut);max-width:34ch}
.stickers{display:flex;flex-wrap:wrap;gap:.6rem}
.sticker{display:inline-flex;align-items:baseline;gap:.5rem;background:var(--c2,#fff);border:2.5px solid var(--ink);border-radius:14px 225px 14px 255px / 255px 14px 225px 14px;padding:.2rem .9rem;font:400 1.35rem var(--h);transition:transform .15s}
.sticker:hover{transform:rotate(-2deg) scale(1.05)}.sticker small{font:700 .85rem var(--b)}
.note{margin-top:2rem;background:var(--yel);border:3px solid var(--ink);border-radius:255px 14px 225px 14px / 14px 225px 14px 255px;padding:1rem 1.4rem;max-width:560px;transform:rotate(.6deg)}
.note h2{font-size:1.9rem}.note p{margin:.2rem 0 .8rem}
.hits{display:grid;gap:.8rem;margin:1.6rem 0}.hit{display:block;background:#fff;border:2.5px solid var(--ink);border-radius:14px 225px 14px 255px / 255px 14px 225px 14px;padding:.6rem 1.2rem}
.hit:hover,.hit:focus-visible{background:var(--yel)}.hit b{display:block;font:400 1.7rem var(--h)}.hit span{display:block;color:var(--mut)}.hit small{font-weight:700;font-size:.85rem}
.none{background:#fff;border:2.5px solid var(--ink);border-radius:255px 14px 225px 14px / 14px 225px 14px 255px;padding:.8rem 1.2rem}.none button{font:inherit;font-weight:700;background:var(--pink);border:2px solid var(--ink);border-radius:14px 225px 14px 255px / 255px 14px 225px 14px;padding:.1rem .8rem;cursor:pointer}
/* topic */
.crumb{display:flex;gap:.5rem;flex-wrap:wrap;font:400 1.25rem var(--h);margin-bottom:.8rem}.crumb a{background:#fff;border:2px solid var(--ink);border-radius:14px 225px 14px 255px / 255px 14px 225px 14px;padding:0 .8rem}
.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:2rem;margin-top:1.5rem}
.toc{position:sticky;top:1rem;align-self:start;font:400 1.3rem/1.3 var(--h)}.toc ul{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}.toc a:hover{background:var(--yel)}
.entry{background:#fff;border:3px solid var(--ink);border-radius:255px 14px 225px 14px / 14px 225px 14px 255px;padding:1.4rem 1.6rem 1.6rem;margin-bottom:1.8rem}
.entry:nth-of-type(even){border-radius:14px 225px 14px 255px / 255px 14px 225px 14px}
.entry h2{font-size:clamp(2.4rem,6vw,3.4rem);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}.chips span{border:2px solid var(--ink);border-radius:14px 225px 14px 255px / 255px 14px 225px 14px;padding:0 .7rem;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.k1{background:var(--yel)}.k2{background:var(--teal)}.k3{background:var(--pink)}.k4{background:#fff}
.sum{font-size:1.3rem;line-height:1.45;max-width:58ch;margin:0 0 .8rem}
.entry ul{max-width:64ch;padding-left:1.3rem}.entry li{margin:.4rem 0}
code{font:.9em ui-monospace,Menlo,monospace;background:#E9EEF3;padding:.05em .3em;border-radius:4px}
.gotcha{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:center;border:2.5px solid var(--ink);border-radius:14px 225px 14px 255px / 255px 14px 225px 14px;background:#FFF1F6;padding:.7rem 1.1rem;margin:1.1rem 0;max-width:64ch}
.gotcha svg{width:46px;transform:rotate(8deg)}.gotcha b{font:400 1.4rem var(--h);margin-right:.4rem}
.srcs{display:flex;flex-wrap:wrap;gap:.5rem}.srcs a{border-bottom:3px solid var(--yel);font-weight:700}.srcs a:hover{background:var(--yel)}
.cmp{background:#fff}.cmp h2{font-size:2.4rem;margin-bottom:.6rem}
table{border-collapse:collapse;width:100%;font-size:1rem}th,td{text-align:left;vertical-align:top;padding:.7rem .8rem;border-bottom:2px dashed #9AA6B2}
thead th{font:400 1.5rem var(--h);border-bottom:3px solid var(--ink)}tbody th{font:400 1.3rem var(--h);width:7rem}
/* lenses */
.lensbar{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0 .6rem}
.lensbtn{font:400 1.35rem var(--h);background:#fff;border:2.5px solid var(--ink);border-radius:14px 225px 14px 255px / 255px 14px 225px 14px;padding:.1rem 1.1rem;cursor:pointer;color:var(--ink)}.lensbtn[aria-pressed=true]{background:var(--yel)}
.about{max-width:60ch;min-height:3.3em;margin:0 0 1rem}
.lanes{filter:none}
.lane{display:grid;grid-template-columns:150px 1fr;gap:.5rem 1rem;align-items:center;padding:.6rem 0;border-top:2px dashed #9AA6B2}
.lane h2{margin:0;font-size:1.5rem}
.cells{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.6rem}
.role{font:400 1.2rem/1.1 var(--h);padding:.7rem .4rem;min-height:3.4rem;border:2.5px solid var(--ink);border-radius:14px 225px 14px 255px / 255px 14px 225px 14px;color:var(--ink);cursor:pointer;transition:opacity .2s}
.c-edge{background:var(--yel)}.c-run{background:#fff}.c-data{background:var(--teal)}.c-ops{background:var(--pink)}
.role.dim{opacity:.28}.role[aria-pressed=true]{outline:3px dashed var(--ink);outline-offset:3px}
.panel2,.panel.p{margin-top:1.5rem}
aside.panel{background:#fff;border:3px solid var(--ink);border-radius:255px 14px 225px 14px / 14px 225px 14px 255px;padding:1rem 1.4rem;max-width:60ch;transform:none;margin-top:1.5rem}aside.panel h2{font-size:2rem}aside.panel p{margin:.4rem 0;color:var(--ink)}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;color:var(--ink);z-index:0;filter:url(#rough)}
.w{opacity:.75;transition:opacity .2s}.w.on{opacity:1;stroke-width:2.8}.w.off{opacity:.1}.role,.lane h2{position:relative;z-index:1}
.wl{font:400 1.1rem 'Caveat Brush',cursive;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
@media(max-width:800px){.hero{grid-template-columns:1fr}.panels,.layout{grid-template-columns:1fr}.toc{position:static}.lane{grid-template-columns:1fr}.cells{grid-template-columns:repeat(3,1fr)}.gap{display:none}}
</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></svg><div class="wrap"><nav class="crumb" aria-label="Breadcrumb"><a href="index.html">Atlas</a><a href="index.html#views">Views</a><span>Lenses</span></nav><header class="hero"><svg class="mascot" viewBox="0 0 90 90" role="img" aria-label="Atlas mascot, a smiling globe"><g fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M45 8C66 7 82 23 82 45C82 67 66 83 45 82C23 83 8 66 8 45C8 23 24 9 45 8Z" fill="#7FE0D2"/><path d="M14 36C28 30 36 40 52 34C62 30 70 33 78 30" stroke-width="2"/><path d="M12 56C26 62 38 52 54 60C64 64 72 60 80 62" stroke-width="2"/><circle cx="34" cy="42" r="3.2" fill="#111"/><circle cx="56" cy="42" r="3.2" fill="#111"/><path d="M33 56C40 64 50 64 58 55"/></g></svg><div><h1>Lenses</h1><p class="say">Where does a service go? One picture of an application, five lenses.</p></div></header><main><div class="lensbar" role="group" aria-label="Lens"><button type="button" class="lensbtn" data-l="all" aria-pressed="true">All</button><button type="button" class="lensbtn" data-l="app" aria-pressed="false">Application</button><button type="button" class="lensbtn" data-l="net" aria-pressed="false">Network</button><button type="button" class="lensbtn" data-l="infra" aria-pressed="false">Infrastructure</button><button type="button" class="lensbtn" data-l="sec" aria-pressed="false">Security</button><button type="button" class="lensbtn" data-l="mon" aria-pressed="false">Monitoring</button></div><p id="about" class="about"></p><div class="lanes" id="lanes" style="position:relative"><div class="lane" role="group" aria-label="Request path"><h2>Request path</h2><div class="cells"><button type="button" class="role c-edge" data-id="users" data-lenses="net sec">Users</button><button type="button" class="role c-edge" data-id="waf" data-lenses="net sec">Edge (CDN/WAF)</button><button type="button" class="role c-edge" data-id="lb" data-lenses="net">Load balancer</button><button type="button" class="role c-run" data-id="web" data-lenses="app infra mon">Web server</button><button type="button" class="role c-run" data-id="app" data-lenses="app infra mon">App service</button><button type="button" class="role c-data" data-id="db" data-lenses="app mon">Database</button></div></div><div class="lane" role="group" aria-label="Supporting services"><h2>Supporting services</h2><div class="cells"><button type="button" class="role c-edge" data-id="dns" data-lenses="net">DNS</button><button type="button" class="role c-run" data-id="secrets" data-lenses="app infra sec">Secrets store</button><button type="button" class="role c-run" data-id="identity" data-lenses="app infra sec">Identity</button><button type="button" class="role c-data" data-id="broker" data-lenses="app mon">Message broker</button><button type="button" class="role c-data" data-id="cache" data-lenses="app mon">Cache</button><button type="button" class="role c-data" data-id="search" data-lenses="app mon">Search</button></div></div><div class="lane" role="group" aria-label="Background work"><h2>Background work</h2><div class="cells"><span class="gap"></span><span class="gap"></span><span class="gap"></span><button type="button" class="role c-run" data-id="worker" data-lenses="app infra mon">Worker</button><button type="button" class="role c-data" data-id="storage" data-lenses="app infra">Storage</button><span class="gap"></span></div></div><div class="lane" role="group" aria-label="Network and access"><h2>Network and access</h2><div class="cells"><button type="button" class="role c-edge" data-id="vpn" data-lenses="net sec">VPN / link</button><button type="button" class="role c-edge" data-id="bastion" data-lenses="net infra sec">Bastion</button><button type="button" class="role c-edge" data-id="firewall" data-lenses="net sec">Firewall</button><span class="gap"></span><button type="button" class="role c-ops" data-id="siem" data-lenses="sec mon">SIEM</button><span class="gap"></span></div></div><div class="lane" role="group" aria-label="Operations"><h2>Operations</h2><div class="cells"><span class="gap"></span><span class="gap"></span><span class="gap"></span><button type="button" class="role c-ops" data-id="collector" data-lenses="mon">Collector</button><button type="button" class="role c-ops" data-id="store" data-lenses="mon sec">Telemetry store</button><button type="button" class="role c-ops" data-id="dash" data-lenses="mon">Dashboards</button></div></div><svg class="wires" id="wires" aria-hidden="true"></svg></div><aside id="panel" class="panel" aria-live="polite"><h2>Pick a role</h2><p>Select a role in the picture to read what it is, where it sits and why it exists.</p></aside><p id="live" class="sr" role="status"></p></main></div><script>
const R={"users": {"name": "Users", "full": "Users and clients", "what": "People and systems that call the application, over the internet or a private network.", "where": "The start of every request path.", "why": "Everything else exists to serve them."}, "waf": {"name": "Edge (CDN/WAF)", "full": "Edge protection and cache", "what": "Caches content at a global edge and can filter malicious web requests with a web application firewall (WAF).", "where": "In front of the load balancer, facing the internet.", "why": "Absorbs load and blocks common attacks before they reach the servers."}, "lb": {"name": "Load balancer", "full": "Load balancer", "what": "Spreads requests over several servers and stops sending to one that is unhealthy. Layer 4 balances TCP or UDP connections; layer 7 balances HTTP requests and can route by URL path or host header.", "where": "Between the edge and the web servers.", "why": "Servers can be added or replaced without clients noticing."}, "web": {"name": "Web server", "full": "Web server or reverse proxy", "what": "Serves pages and static files, and passes dynamic requests to the application layer.", "where": "First tier behind the load balancer.", "why": "Keeps slow clients and static files away from the application code."}, "app": {"name": "App service", "full": "Application service", "what": "Runs the business logic. Talks to the data tier and to the side services.", "where": "Second tier. Not reachable from the internet directly.", "why": "The one place that decides what is allowed and what is stored."}, "db": {"name": "Database", "full": "Relational database", "what": "Stores structured data with transactions and a schema.", "where": "Data tier. Reachable only from the application tier.", "why": "The system of record: other stores hold copies."}, "dns": {"name": "DNS", "full": "Name resolution (DNS)", "what": "Turns a name such as app.example.com into an address. Azure has public zones and private zones that resolve names inside linked virtual networks.", "where": "Off the request path: clients ask it first, then connect.", "why": "Moving traffic means changing a record, not the application."}, "secrets": {"name": "Secrets store", "full": "Secrets store", "what": "Keeps secrets, keys and certificates and hands them to the application on request, with access control and logging.", "where": "Beside the application tier: the application asks for a secret, so it need not live in code or config.", "why": "Secrets are managed in one place, and access can be logged."}, "identity": {"name": "Identity", "full": "Identity provider", "what": "Signs users and services in and issues the tokens the application checks (OAuth 2.0 and OpenID Connect).", "where": "Beside the application tier: the application calls out to it.", "why": "Sign-in rules live in one place, not in every application."}, "broker": {"name": "Message broker", "full": "Message broker", "what": "Holds messages between a sender and a receiver so they do not have to run at the same time.", "where": "Beside the application tier. A sender puts messages in, a worker takes them out.", "why": "Absorbs spikes, decouples services, and lets a failed job be retried."}, "cache": {"name": "Cache", "full": "Cache", "what": "Keeps frequently read data in memory so the application does not ask the database every time.", "where": "Close to the application.", "why": "Lower latency and fewer database queries."}, "search": {"name": "Search", "full": "Search index", "what": "A service for search over a copy of the data. Not the system of record.", "where": "Beside the application tier, fed from the database or the broker.", "why": "Databases are poor at free-text search; this is built for it."}, "worker": {"name": "Worker", "full": "Background worker", "what": "Takes messages from the broker and does slow work outside the web request.", "where": "Same tier as the application, behind the broker.", "why": "The user is not kept waiting for slow jobs."}, "storage": {"name": "Storage", "full": "Object and file storage", "what": "Keeps files that do not belong in a database: uploads, media, exports and backups. Object storage is reached over an API; file shares over SMB or NFS. A disk belongs to one server and is not drawn.", "where": "Beside the application tier. The application and the workers read and write it.", "why": "Cheap, large and shared; keeps the servers free of state."}, "vpn": {"name": "VPN / link", "full": "Private connectivity", "what": "An encrypted tunnel, or a private connection through a provider, from an office or another network into the cloud network.", "where": "At the edge of the private network (in the hub, in a hub-and-spoke design).", "why": "Reach private services without exposing them to the internet."}, "bastion": {"name": "Bastion", "full": "Bastion (admin access)", "what": "A managed entry point for administrators: RDP and SSH to virtual machines over TLS, without a public address on the machines.", "where": "In the hub (hub-and-spoke), reached over the VPN or the internet.", "why": "Servers stay private: one door instead of an open SSH or RDP port on each."}, "firewall": {"name": "Firewall", "full": "Firewall (central service)", "what": "A stateful firewall service that allows or blocks traffic between networks by rules. It is a central service, not on every hop.", "where": "In the hub (hub-and-spoke), as the main egress point. Whether inbound web traffic passes through it depends on the design.", "why": "One place to see and control what crosses a boundary."}, "filter": {"name": "Filter rules", "full": "Traffic filter rules", "what": "Allow and deny rules attached to a subnet or a network interface. Not a separate box: a setting that applies at network boundaries. Layer 3 and 4 only.", "where": "On a subnet or a network interface, for example in front of the application servers.", "why": "Each tier accepts only the traffic it expects."}, "collector": {"name": "Collector", "full": "Telemetry collector or agent", "what": "Runs next to the workload, gathers logs, metrics and traces, and forwards them.", "where": "On each server or beside each container.", "why": "The application does not need to know where telemetry ends up."}, "store": {"name": "Telemetry store", "full": "Telemetry store", "what": "Keeps logs and metrics so they can be queried and alerted on.", "where": "Central, outside the application servers.", "why": "Evidence survives the server that produced it."}, "dash": {"name": "Dashboards", "full": "Dashboards and alerts", "what": "Shows telemetry and notifies people when a rule trips.", "where": "At the end of the monitoring path.", "why": "Turns stored data into something a person can act on."}, "siem": {"name": "SIEM", "full": "Security events (SIEM)", "what": "Collects security events from many systems, correlates them, raises detections and supports investigation.", "where": "Beside the telemetry store: it reads logs from the servers, the firewall and the identity provider.", "why": "One place to look for an attack across all systems."}},A={"all": "Every role and every connection in one picture. Pick a lens to keep only what it needs.", "app": "The tiers of an application and the services that help them: who talks to whom.", "net": "How traffic reaches the application, and how administrators reach the servers. The shield is a set of filter rules on that hop.", "infra": "What runs the code, and who it runs as.", "sec": "Who can get in, what is checked on the way, where secrets are kept and where security events end up.", "mon": "How the application and its servers send logs, metrics and traces, and where they end up."},E=[{"from": "users", "to": "waf", "label": "", "style": "solid", "lenses": ["net", "sec"]}, {"from": "waf", "to": "lb", "label": "", "style": "solid", "lenses": ["net"]}, {"from": "lb", "to": "web", "label": "", "style": "solid", "lenses": ["net"], "badge": "filter"}, {"from": "web", "to": "app", "label": "", "style": "solid", "lenses": ["app"]}, {"from": "app", "to": "db", "label": "", "style": "solid", "lenses": ["app"]}, {"from": "users", "to": "dns", "label": "", "style": "dash", "lenses": ["net"]}, {"from": "app", "to": "identity", "label": "sign-in", "style": "dash", "lenses": ["app", "infra", "sec"]}, {"from": "app", "to": "secrets", "label": "secrets", "style": "dash", "lenses": ["app", "infra", "sec"]}, {"from": "app", "to": "broker", "label": "messages", "style": "solid", "lenses": ["app"]}, {"from": "app", "to": "cache", "label": "hot data", "style": "solid", "lenses": ["app"]}, {"from": "app", "to": "search", "label": "queries", "style": "solid", "lenses": ["app"]}, {"from": "app", "to": "storage", "label": "files", "style": "solid", "lenses": ["app", "infra"]}, {"from": "worker", "to": "storage", "label": "", "style": "dash", "lenses": ["app", "infra"]}, {"from": "broker", "to": "worker", "label": "", "style": "solid", "lenses": ["app"]}, {"from": "vpn", "to": "bastion", "label": "", "style": "dash", "lenses": ["net", "sec"]}, {"from": "collector", "to": "store", "label": "", "style": "solid", "lenses": ["mon"]}, {"from": "store", "to": "dash", "label": "", "style": "solid", "lenses": ["mon"]}, {"from": "store", "to": "siem", "label": "security events", "style": "dot", "lenses": ["sec", "mon"]}];
const btns=[...document.querySelectorAll('.lensbtn')],roles=[...document.querySelectorAll('.role')],panel=document.getElementById('panel'),live=document.getElementById('live');
function lens(id){btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===id));let n=0;
  roles.forEach(r=>{const on=id==='all'||r.dataset.lenses.split(' ').includes(id);r.classList.toggle('dim',!on);if(on)n++});
  document.getElementById('about').textContent=A[id];draw(id);live.textContent=btns.find(b=>b.dataset.l===id).textContent+' lens: '+n+' roles';}
btns.forEach(b=>b.addEventListener('click',()=>lens(b.dataset.l)));
const DEF=panel.innerHTML;
function clearSel(){roles.forEach(x=>x.setAttribute('aria-pressed',false));panel.innerHTML=DEF;draw()}
roles.forEach(r=>r.addEventListener('click',()=>{if(r.getAttribute('aria-pressed')==='true'){clearSel();return}const d=R[r.dataset.id];roles.forEach(x=>x.setAttribute('aria-pressed',x===r));
  panel.innerHTML='<h2>'+d.full+'</h2><p>'+d.what+'</p><p><b>Where</b> '+d.where+'</p><p><b>Why</b> '+d.why+'</p>';}));
document.addEventListener('click',e=>{if(!e.target.closest('.role,.panel,.lensbtn'))clearSel()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.role[aria-pressed=true]'))clearSel()});
const lanesEl=document.getElementById('lanes'),svg=document.getElementById('wires');let cur='all',hov=null;
function rp(p,r){let d='M'+p[0][0]+' '+p[0][1];for(let i=1;i<p.length-1;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i],[x2,y2]=p[i+1],l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1),k=Math.min(r,l1/2,l2/2);
  d+='L'+(x1-(x1-x0)/l1*k)+' '+(y1-(y1-y0)/l1*k)+'Q'+x1+' '+y1+' '+(x1+(x2-x1)/l2*k)+' '+(y1+(y2-y1)/l2*k)}
  return d+'L'+p[p.length-1][0]+' '+p[p.length-1][1]}
function draw(id){cur=id||cur;const o=lanesEl.getBoundingClientRect();
  const sel=document.querySelector('.role[aria-pressed=true]'),act=hov||(sel&&sel.dataset.id)||null;
  const box=i=>{const b=document.querySelector('.role[data-id="'+i+'"]');if(!b)return null;const r=b.getBoundingClientRect();return {l:r.left-o.left,r:r.right-o.left,t:r.top-o.top,b:r.bottom-o.top,w:r.width,h:r.height,cx:(r.left+r.right)/2-o.left,cy:(r.top+r.bottom)/2-o.top}};
  const ed=E.filter(e=>cur==='all'||e.lenses.includes(cur)).map(e=>({e,a:box(e.from),b:box(e.to)})).filter(x=>x.a&&x.b);
  ed.forEach(x=>{if(Math.abs(x.a.cy-x.b.cy)<4){x.sa=x.a.cx<x.b.cx?'r':'l';x.sb=x.a.cx<x.b.cx?'l':'r'}else{const dn=x.b.cy>x.a.cy;x.sa=dn?'b':'t';x.sb=dn?'t':'b'}});
  const slots={};ed.forEach(x=>{[['from','sa','b'],['to','sb','a']].forEach(([w,sd,oth])=>{(slots[x.e[w]+x[sd]]=slots[x.e[w]+x[sd]]||[]).push([x,w,sd,oth])})});
  Object.values(slots).forEach(L=>{const hz='lr'.includes(L[0][2]==='sa'?L[0][0].sa:L[0][0].sb);
    L.sort((p,q)=>hz?p[0][p[3]].cy-q[0][q[3]].cy:p[0][p[3]].cx-q[0][q[3]].cx);
    L.forEach(([x,w,sd],k)=>{const bx=w==='from'?x.a:x.b,side=x[sd],f=(k+1)/(L.length+1);
      x[w==='from'?'pa':'pb']=side==='b'?[bx.l+bx.w*f,bx.b]:side==='t'?[bx.l+bx.w*f,bx.t]:side==='r'?[bx.r,bx.t+bx.h*f]:[bx.l,bx.t+bx.h*f]})});
  let h='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
  ed.forEach(x=>{const [ax,ay]=x.pa,[bx,by]=x.pb,hz=x.sa==='r'||x.sa==='l',on=act&&(x.e.from===act||x.e.to===act);
    const pts=hz?(Math.abs(ay-by)<2?[[ax,ay],[bx,by]]:[[ax,ay],[(ax+bx)/2,ay],[(ax+bx)/2,by],[bx,by]]):(Math.abs(ax-bx)<2?[[ax,ay],[bx,by]]:[[ax,ay],[ax,(ay+by)/2],[bx,(ay+by)/2],[bx,by]]);
    const cls='w'+(act?(on?' on':' off'):'');
    h+='<path class="'+cls+'" d="'+rp(pts,9)+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"'+(x.e.style==='dash'?' stroke-dasharray="6 5"':x.e.style==='dot'?' stroke-dasharray="1 5"':'')+'/>';
    if(x.e.label&&((!act&&cur!=='all')||on)){const mx=hz?(ax+bx)/2:(ax+bx)/2,my=hz?ay-7:(ay+by)/2-6;h+='<text x="'+mx+'" y="'+my+'" text-anchor="middle" class="wl">'+x.e.label+'</text>'}});
  svg.setAttribute('viewBox','0 0 '+o.width+' '+o.height);svg.innerHTML=h;}
roles.forEach(r=>{['mouseenter','focus'].forEach(ev=>r.addEventListener(ev,()=>{hov=r.dataset.id;draw()}));['mouseleave','blur'].forEach(ev=>r.addEventListener(ev,()=>{hov=null;draw()}));r.addEventListener('click',()=>draw())});
addEventListener('resize',()=>draw());if(document.fonts)document.fonts.ready.then(()=>draw());
lens('all');
</script></body></html>
