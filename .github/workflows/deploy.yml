name: Deploy (atlas.marcberthelette.com)

# Publishes only when a release is published (gh release create <tag> --target main), or by hand.
# The site is the committed dist/ at the release tag; the version in the About window is the tag in VERSION.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6  # a release checks out its tag; a manual run checks out the branch it was started on
      - name: Deploy dist/ with wrangler
        run: npx --yes wrangler@4.150.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
