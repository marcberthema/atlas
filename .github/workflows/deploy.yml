name: Deploy (atlas.marcberthelette.com)

on:
  push:
    branches: [main]
    paths: ["dist/**"]
  # commits pushed with GITHUB_TOKEN (the daily check) do not trigger push workflows
  workflow_run:
    workflows: ["Daily check (azure topic)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - name: Did the latest commit change dist/?
        id: dist
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && git diff --quiet HEAD~1 HEAD -- dist; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy dist/ with wrangler
        if: steps.dist.outputs.changed == 'true'
        run: npx --yes wrangler@4.150.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
